services:
  db:
    image: postgres:16
    container_name: tasktracker_db
    environment:
      POSTGRES_DB: tasktracker
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tasktracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
